    <script>
      (() => {
        const referralStorageKey = "naim-payment-referral";
        const referralParamNames = ["ref", "referral", "r"];
        const normalizeReferral = (value) => (
          (value || "")
            .trim()
            .replace(/\s+/g, "_")
            .replace(/[^0-9A-Za-zА-Яа-яЁё_.:@+-]/g, "")
            .slice(0, 64)
        );

        const redirectedPath = window.sessionStorage.getItem("naim-spa-redirect");
        if (redirectedPath) {
          window.sessionStorage.removeItem("naim-spa-redirect");
          let redirectedState = null;
          try { redirectedState = JSON.parse(window.sessionStorage.getItem("naim-spa-redirect-state") || "null"); } catch {}
          window.sessionStorage.removeItem("naim-spa-redirect-state");
          const currentLocation = `${window.location.pathname}${window.location.search}${window.location.hash}`;

          if (redirectedPath !== currentLocation) {
            window.history.replaceState(redirectedState, "", redirectedPath);
          }
        }

        // Keep checkout capabilities out of analytics and browser-visible URLs.
        const privateCheckout = new URLSearchParams(window.location.hash.slice(1));
        if (privateCheckout.has('discount_code') || privateCheckout.has('reseller_checkout')) {
          window.__naimCheckoutPrivate = Object.freeze({code:privateCheckout.get('discount_code')||'',reseller:privateCheckout.get('reseller_checkout')||''});
          privateCheckout.delete('discount_code'); privateCheckout.delete('reseller_checkout');
          window.history.replaceState(window.history.state,'',window.location.pathname+window.location.search+(privateCheckout.size?'#'+privateCheckout.toString():''));
        }
        const query = new URLSearchParams(window.location.search);
        let hasReferralParam = false;
        let referral = "";

        referralParamNames.forEach((name) => {
          if (!query.has(name)) {
            return;
          }

          hasReferralParam = true;
          referral ||= normalizeReferral(query.get(name));
          query.delete(name);
        });

        if (!hasReferralParam) {
          return;
        }

        if (referral) {
          try {
            window.localStorage.setItem(referralStorageKey, referral);
          } catch {
            // Ignore storage restrictions: URL cleanup should still happen.
          }
        }

        const cleanSearch = query.toString();
        window.history.replaceState(
          window.history.state,
          "",
          `${window.location.pathname}${cleanSearch ? `?${cleanSearch}` : ""}${window.location.hash}`,
        );
      })();
    </script>
